<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank=()=>({pn:'My CV',p:{name:'',title:'',email:'',phone:'',loc:'',links:''},summary:'',exp:[],edu:[],proj:[],cert:[],skills:'',langs:'',order:['sum','exp','edu','skills','proj','cert','langs'],off:{},cl:{rec:'',co:'',job:'',why:'',tone:'confident',text:''},jd:''});
let S={cur:'a',pr:{a:blank()},ui:{theme:'',tpl:'classic',ac:'#2563eb',ff:'Arial,Helvetica,sans-serif',fs:11,lh:1.4,lang:'en'}};
try{const x=JSON.parse(localStorage.getItem('ck1'));if(x&&x.pr&&x.pr[x.cur])S=x}catch(e){}
let step=0,view='cv',lastTA=null;

const set=(k,v)=>{const[o,p]=rt(k),a=p.split('.'),l=a.pop();a.reduce((x,c)=>x[c],o)[l]=v};
const N={en:['Personal','Summary','Experience','Education','Skills','Extras','Cover letter','Tools','Tracker'],es:['Datos','Resumen','Experiencia','Educación','Habilidades','Extras','Carta','Herramientas','Seguimiento'],fr:['Infos','Résumé','Expérience','Formation','Compétences','Extras','Lettre','Outils','Suivi']};
const B={en:['‹ Back','Next ›','👁 Preview','✏️ Edit','🔒 Private: your data never leaves this device.','complete'],es:['‹ Atrás','Siguiente ›','👁 Vista','✏️ Editar','🔒 Privado: tus datos nunca salen de este dispositivo.','completo'],fr:['‹ Retour','Suivant ›','👁 Aperçu','✏️ Modifier','🔒 Privé : vos données ne quittent jamais cet appareil.','complet']};
const TP=['classic','modern','minimal','creative','executive','compact','sidebar'];
const bl=x=>(x.b||'').split('\n').map(s=>s.trim()).filter(Boolean),ctc=p=>[p.email,p.phone,p.loc,p.links].filter(Boolean);
let tt;const persist=()=>{clearTimeout(tt);tt=setTimeout(()=>{try{localStorage.setItem('ck1',JSON.stringify(S))}catch(e){}},300)};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
const I=(l,k,ph,v)=>`<label>${l}<input data-k="${k}" ${v?`data-v="${v}" type="${v=='email'?'email':'tel'}" `:''}value="${esc(get(k))}" placeholder="${esc(ph)}"></label>`;
const A=(l,k,ph,r)=>`<label>${l}<textarea data-k="${k}" rows="${r||4}" placeholder="${esc(ph)}">${esc(get(k))}</textarea></label>`;
const F1=[['t','Job title','Marketing Manager'],['o','Company','Acme Inc.'],['dt','Dates','Jan 2021 – Present'],['b','Achievements (one per line)','Grew organic traffic 45% in 6 months',1]];
const F2=[['t','Degree','BA Communications'],['o','School','University of Texas'],['dt','Dates','2014 – 2018']];
const F3=[['t','Name / title','Brand relaunch'],['o','Organisation / issuer','Acme Inc.'],['dt','Date','2023'],['b','Details (one per line)','Coordinated rebrand across 5 channels',1]];
function list(k,F,add){return D()[k].map((x,i)=>`<div class="card"><div class="row"><b>#${i+1}</b><span><button class="b" aria-label="Move up" data-a="up:${k}:${i}">↑</button> <button class="b" aria-label="Move down" data-a="dn:${k}:${i}">↓</button> <button class="b" aria-label="Remove" data-a="rm:${k}:${i}">✕</button></span></div>${F.map(([f,l,ph,ta])=>ta?A(l,`${k}.${i}.${f}`,ph):I(l,`${k}.${i}.${f}`,ph)).join('')}</div>`).join('')+`<button class="b p" data-a="add:${k}">+ ${add}</button>`}
const VERBS='Led Built Increased Reduced Launched Optimized Managed Delivered Designed Negotiated Automated Grew'.split(' ');
const NM={sum:'Summary',exp:'Experience',edu:'Education',skills:'Skills',proj:'Projects',cert:'Certifications',langs:'Languages'};
const STEPS=[
()=>I('Full name','p.name','Jane Doe')+I('Job title','p.title','Marketing Manager')+I('Email','p.email','jane@email.com','email')+I('Phone','p.phone','+1 555 123 4567','tel')+I('Location','p.loc','Austin, TX')+I('Links (LinkedIn, portfolio)','p.links','linkedin.com/in/janedoe')+photoUI(),
()=>A('Professional summary','summary','Marketing manager with 7+ years growing B2B brands…',6)+`<p class="tip">Aim for 2–4 sentences, 150–600 characters.</p><button class="b p" data-a="sum">✨ Generate summary</button>`,
()=>`<p class="tip">Tap a verb to start a bullet in the last field you edited. <b>Quantify your impact:</b> add numbers like %, $, time saved or team size.</p><div class="chips">${VERBS.map(v=>`<button class="ch" data-a="vb:${v}">${v}</button>`).join('')}</div>`+`<div class="row" style="justify-content:flex-start;gap:8px;padding:8px 0"><button class="b p" data-a="improve">✨ Improve bullets</button><button class="b" data-a="tail">🎯 Tailor to job</button></div>`+list('exp',F1,'Add experience'),
()=>list('edu',F2,'Add education'),
()=>A('Skills (comma separated)','skills','SEO, Google Analytics, Team Leadership',3)+I('Languages (comma separated)','langs','English (native), Spanish (fluent)'),
()=>`<h3>Projects</h3>`+list('proj',F3,'Add project')+`<h3>Certifications</h3>`+list('cert',F3.slice(0,3),'Add certification'),
()=>I('Recipient name','cl.rec','Alex Smith')+I('Company','cl.co','Northwind')+I('Job title','cl.job','Head of Marketing')+`<label>Tone</label><div class="chips">${['formal','confident','friendly'].map(t=>`<button class="ch ${D().cl.tone==t?'on':''}" data-a="tone:${t}">${t}</button>`).join('')}</div>`+A('Why you fit (optional)','cl.why','I love your mission and have run similar launches…',3)+`<button class="b p" style="margin-top:10px" data-a="gen">✨ Generate letter from my CV</button>`+A('Your letter (editable)','cl.text','Click Generate, then edit freely…',12),
()=>`<h3>Style</h3><label>Font<select data-k="ui.ff">${[['Arial,Helvetica,sans-serif','Arial'],['Georgia,serif','Georgia'],['Verdana,sans-serif','Verdana'],['"Times New Roman",serif','Times New Roman'],['"Trebuchet MS",sans-serif','Trebuchet']].map(([v,n])=>`<option value="${esc(v)}" ${S.ui.ff==v?'selected':''}>${n}</option>`).join('')}</select></label><label>Font size (${S.ui.fs}px)<input type="range" data-k="ui.fs" min="9" max="13" step=".5" value="${S.ui.fs}"></label><label>Line spacing (${S.ui.lh})<input type="range" data-k="ui.lh" min="1.1" max="1.8" step=".05" value="${S.ui.lh}"></label><label>Theme<select data-k="ui.theme">${[['','Auto'],['light','Light'],['dark','Dark']].map(([v,n])=>`<option value="${v}" ${S.ui.theme==v?'selected':''}>${n}</option>`).join('')}</select></label>`+
`<h3>Sections</h3>${D().order.map((k,i)=>`<div class="row"><span>${NM[k]}</span><span><button class="b" data-a="tg:${k}">${D().off[k]?'Show':'Hide'}</button> <button class="b" aria-label="Move up" data-a="up:order:${i}">↑</button> <button class="b" aria-label="Move down" data-a="dn:order:${i}">↓</button></span></div>`).join('')}`+
`<h3>Job match</h3>${A('Paste the job description','jd','Paste the full job posting here…',5)}<button class="b p" data-a="jd">Analyze match &amp; ATS score</button><div id="out"></div>`+
`<h3>Profiles</h3>${I('Profile name','pn','Marketing CV')}<div class="row"><button class="b" data-a="pnew">+ New</button><button class="b" data-a="pdup">Duplicate</button><button class="b" data-a="pdel">Delete</button></div>`+
`<h3>Data</h3><div class="row"><button class="b" data-a="exp">Export backup</button><button class="b" data-a="imp">Import</button><button class="b" data-a="sample">Sample data</button></div>`,tracker];
const STOP=new Set('the and for with that this you your will our are have from they their been has can who all its not but was were any more than into such per able also etc job work team role experience'.split(' '));
const txt=d=>JSON.stringify([d.p,d.summary,d.exp,d.edu,d.proj,d.cert,d.skills,d.langs]).toLowerCase();
function jdm(){const t=(D().jd||'').toLowerCase().match(/[a-z][a-z+#.\-]{2,}/g)||[],f={};t.forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});const k=Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,25).map(x=>x[0]),c=txt(D());return{k,hit:k.filter(w=>c.includes(w)),miss:k.filter(w=>!c.includes(w))}}
function ats(){const d=D(),w=txt(d).split(/\s+/).length,t=[],j=d.jd?jdm():null;let s=0,m=90;const ck=(ok,n,msg)=>{ok?s+=n:t.push(msg)};
const b=d.exp.flatMap(bl);ck(/\S+@\S+\.\S+/.test(d.p.email),10,'Add a valid email address.');ck(d.p.phone,5,'Add a phone number.');ck(d.p.name&&d.p.title,10,'Add your name and target job title.');
ck(d.summary.length>=150&&d.summary.length<=600,10,'Keep your summary between 150 and 600 characters.');ck(b.length>=4,15,'Add at least 4 achievement bullets.');
ck(b.filter(x=>/\d/.test(x)).length>=2,15,'Quantify at least 2 bullets with numbers (%, $, time, team size).');ck(d.skills.split(',').filter(x=>x.trim()).length>=6,10,'List at least 6 skills.');
ck(d.edu.length,5,'Add your education.');ck(w>=250&&w<=800,10,`Your CV has about ${w} words; aim for 250–800 (1–2 pages).`);
if(j&&j.k.length){m=100;ck(j.hit.length/j.k.length>=.6,10,'Work more job-description keywords into your skills and bullets.')}else t.push('Paste a job description to check keyword match.');
return{sc:Math.round(s/m*100),t,j}}
function out(){const e=$('#out');if(!e)return;const a=ats(),j=a.j;e.innerHTML=`<div class="card"><b style="font-size:22px">ATS score: ${a.sc}/100</b><ul>${a.t.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Looking great!</li>'}</ul></div>`+(j&&j.k.length?`<div class="card"><b>Keywords found</b><br>${j.hit.map(w=>`<span class="k hit">${esc(w)}</span>`).join('')||'–'}<br><b>Missing</b><br>${j.miss.map(w=>`<span class="k miss">${esc(w)}</span>`).join('')||'–'}<p class="tip">Add missing terms to Skills or your bullets, but only where they truly apply to you.</p></div>`:'')}

const head=(p,d)=>`<header>${d&&d.photo&&d.showPh?`<img class="ph" src="${d.photo}" alt="">`:''}<h1>${esc(p.name||'Your Name')}</h1><div class="ti">${esc(p.title)}</div><div class="ct">${ctc(p).map(esc).join(' · ')}</div></header>`;
const secH=s=>`<section><h2>${s.h}</h2>${s.tx?`<p>${esc(s.tx)}</p>`:s.it.map(x=>`<div class="it"><div class="r"><b>${esc(x.t)}</b><span>${esc(x.dt)}</span></div>${x.o?`<div class="o">${esc(x.o)}</div>`:''}${bl(x).length?`<ul>${bl(x).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}</div>`).join('')}</section>`;
const cvHTML=d=>{const a=secs(d);if(S.ui.tpl!='sidebar')return head(d.p,d)+a.map(secH).join('');const sd=['Skills','Languages','Certifications'];return head(d.p,d)+`<div class="cols"><div>${a.filter(s=>!sd.includes(s.h)).map(secH).join('')}</div><aside>${a.filter(s=>sd.includes(s.h)).map(secH).join('')}</aside></div>`};
const clHTML=d=>head(d.p,d)+`<p style="margin-top:1.5em">${new Date().toLocaleDateString()}</p><div style="white-space:pre-wrap;margin-top:1em">${esc(d.cl.text||'Open the “Cover letter” step and tap Generate.')}</div>`;
function fit(){const w=$('#wrap').clientWidth;if(w>50)$('#doc').style.zoom=Math.min(1,(w-2)/794)}
function pct(){const d=D(),c=[d.p.name,d.p.title,d.p.email,d.p.phone,d.p.loc,d.summary,d.exp[0]&&d.exp[0].t,d.exp[0]&&bl(d.exp[0]).length,d.edu[0]&&d.edu[0].t,d.skills];return Math.round(c.filter(Boolean).length/c.length*100)}
function after(){const u=S.ui,el=$('#doc');el.className='paper t-'+u.tpl;el.style.cssText=`--pc:${u.ac};--ff:${u.ff};--fs:${u.fs}px;--lh:${u.lh}`;el.innerHTML=view=='cl'?clHTML(D()):cvHTML(D());fit();
$('#ac').value=u.ac;$('#pg').style.width=pct()+'%';$('#pt').textContent=`${pct()}% ${B[u.lang][5]}`;$('#vcv').classList.toggle('on',view=='cv');$('#vcl').classList.toggle('on',view=='cl');
$('#tp').innerHTML=TP.map(t=>`<button class="ch ${u.tpl==t?'on':''}" data-a="tpl:${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');persist()}
function theme(){const t=S.ui.theme;t?document.documentElement.dataset.theme=t:delete document.documentElement.dataset.theme}
function shell(){const L=S.ui.lang,b=B[L];$('#lang').value=L;$('#priv').textContent=b[4];$('#bb').textContent=b[0];$('#bn').textContent=b[1];$('#pvb').textContent=document.body.classList.contains('pv')?b[3]:b[2];
$('#prof').innerHTML=Object.keys(S.pr).map(k=>`<option value="${k}" ${k==S.cur?'selected':''}>${esc(S.pr[k].pn||'Untitled')}</option>`).join('');
$('#tabs').innerHTML=N[L].map((n,i)=>`<button class="ch ${i==step?'on':''}" data-a="go:${i}">${i+1}. ${n}</button>`).join('');theme()}
function renderForm(){$('#form').innerHTML=STEPS[step]();if(step==7)out()}
function renderAll(){Object.values(S.pr).forEach(mig);shell();renderForm();after()}
const rf=()=>{renderForm();after()};
function go(i){step=Math.max(0,Math.min(8,i));view=step==6?'cl':'cv';renderAll();scrollTo(0,0)}
function gen(){const d=D(),c=d.cl,p=d.p,j=c.job||p.title||'open',co=c.co||'your company',r=d.exp[0]||{},b0=bl(r)[0],sk=d.skills.split(',').map(s=>s.trim()).filter(Boolean).slice(0,3).join(', ');
const T={formal:[`I am writing to express my interest in the ${j} position at ${co}.`,'I would welcome the opportunity to discuss how my qualifications meet your requirements. Thank you for your time and consideration.','Yours sincerely,'],confident:[`I’m excited to apply for the ${j} role at ${co}, and I’m confident I can make an immediate impact.`,`I’d welcome a conversation about how I can help ${co} reach its goals.`,'Best regards,'],friendly:[`I was delighted to see the ${j} opening at ${co} and would love to be considered!`,'Thank you so much for reading. I’d really enjoy chatting about the role.','Warm regards,']}[c.tone||'confident'];
const m=[r.t?`Most recently, as ${r.t}${r.o?' at '+r.o:''}, I ${b0?b0.charAt(0).toLowerCase()+b0.slice(1).replace(/\.$/,''):'delivered strong, measurable results'}.`:'',sk?`My core strengths include ${sk}.`:'',c.why].filter(Boolean).join(' ');
c.text=`Dear ${c.rec||'Hiring Manager'},\n\n${T[0]}\n\n${m}\n\n${T[1]}\n\n${T[2]}\n${p.name}`}
function sample(){Object.assign(D(),{p:{name:'Jane Doe',title:'Marketing Manager',email:'jane.doe@email.com',phone:'+1 555 123 4567',loc:'Austin, TX',links:'linkedin.com/in/janedoe'},summary:'Marketing manager with 7+ years growing B2B brands through content, SEO and paid campaigns. Led teams of up to 8 and consistently beat pipeline targets while keeping acquisition costs low.',exp:[{t:'Marketing Manager',o:'Acme Inc.',dt:'2021 – Present',b:'Grew organic traffic 145% in 12 months\nLed a team of 6 and managed a $400K annual budget\nLaunched a webinar series that generated 1,200 leads'},{t:'Content Specialist',o:'Brightly',dt:'2018 – 2021',b:'Published 120+ articles, lifting newsletter sign-ups 38%\nImproved email open rates from 18% to 31%'}],edu:[{t:'BA Communications',o:'University of Texas',dt:'2014 – 2018'}],proj:[{t:'Brand relaunch',o:'Acme Inc.',dt:'2023',b:'Coordinated a rebrand across 5 channels in 8 weeks'}],cert:[{t:'Google Analytics Certified',o:'Google',dt:'2022'}],skills:'SEO, Content Strategy, Google Analytics, HubSpot, Paid Ads, Team Leadership, A/B Testing',langs:'English (native), Spanish (fluent)'});D().cl.co='Northwind';D().cl.job='Head of Marketing'}
async function sv(name,data){let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();a.remove();return}
try{await dl.save({filename:name,data});toast('Saved ✓')}catch(e){if(e&&e.code!='declined')toast('Could not save: '+(e.message||e.code))}}
const fname=()=>((D().p.name||'CV').replace(/[^\w\-]+/g,'_')+(view=='cl'?'_cover_letter':'_CV'));
async function pdf(){if(!window.html2pdf)return toast('PDF library failed to load. Check your connection and retry.');toast('Preparing PDF…');
const w=document.createElement('div'),el=$('#doc').cloneNode(true);el.style.zoom=1;w.style.cssText='position:fixed;left:-9999px;top:0';w.appendChild(el);document.body.appendChild(w);
try{const bl=await html2pdf().set({margin:[10,0,10,0],image:{type:'jpeg',quality:.95},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy'],avoid:['.it','h2','li','p']}}).from(el).outputPdf('blob');await sv(fname()+'.pdf',bl)}catch(e){toast('PDF failed: '+(e.message||e))}finally{w.remove()}}
async function docxf(){if(!window.docx)return toast('DOCX library failed to load. Check your connection and retry.');
try{const{Document,Paragraph,TextRun,HeadingLevel,Packer}=docx,d=D(),p=d.p,ch=[],P=(t,r)=>new Paragraph({children:[new TextRun({text:t,...r})]});
ch.push(new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun(p.name||'Your Name')]}));if(p.title)ch.push(P(p.title,{bold:true}));ch.push(P(ctc(p).join(' | ')));
if(view=='cl'){ch.push(P(new Date().toLocaleDateString()));(d.cl.text||'').split('\n').forEach(l=>ch.push(P(l)))}
else secs(d).forEach(s=>{ch.push(new Paragraph({heading:HeadingLevel.HEADING_1,children:[new TextRun(s.h)]}));if(s.tx)ch.push(P(s.tx));else s.it.forEach(x=>{ch.push(new Paragraph({children:[new TextRun({text:x.t,bold:true}),new TextRun((x.o?' – '+x.o:'')+(x.dt?'  ('+x.dt+')':''))]}));bl(x).forEach(b=>ch.push(new Paragraph({text:b,bullet:{level:0}})))})});
const f=S.ui.ff.split(',')[0].replace(/"/g,'');await sv(fname()+'.docx',await Packer.toBlob(new Document({creator:'CareerKit',styles:{default:{document:{run:{font:f,size:Math.round(S.ui.fs*2)}}}},sections:[{children:ch}]})))}catch(e){toast('DOCX failed: '+(e.message||e))}}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;let v=e.target.value;if(e.target.type=='range')v=+v;set(k,v);const t=e.target.dataset.v;
if(t)e.target.classList.toggle('bad',!!v&&!(t=='email'?/^\S+@\S+\.\S+$/:/^[+\d][\d\s\-().]{6,}$/).test(v));if(k=='pn')shell();if(k=='ui.theme')theme();after()});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k=='ui.fs'||k=='ui.lh')rf()});
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('textarea[data-k$=".b"]'))lastTA=e.target});
$('#prof').onchange=e=>{S.cur=e.target.value;renderAll()};$('#lang').onchange=e=>{S.ui.lang=e.target.value;renderAll()};$('#ac').oninput=e=>{S.ui.ac=e.target.value;after()};
$('#imp').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x.pr||!x.pr[x.cur])throw 0;S=x;renderAll();toast('Backup imported ✓')}catch(_){toast('That file is not a valid CareerKit backup.')}e.target.value=''};
document.addEventListener('click',e=>{const bt=e.target.closest('[data-a]');if(!bt)return;const[a,x,y]=bt.dataset.a.split(':'),d=D();
if(a=='add'){d[x].push({t:'',o:'',dt:'',b:''});rf()}else if(a=='rm'){d[x].splice(+y,1);rf()}
else if(a=='up'||a=='dn'){const n=+y+(a=='up'?-1:1),l=d[x];if(n>=0&&n<l.length){[l[y],l[n]]=[l[n],l[y]];rf()}}
else if(a=='tg'){d.off[x]=!d.off[x];rf()}else if(a=='go')go(+x);else if(a=='next')go(step+1);else if(a=='back')go(step-1);
else if(a=='pv'){document.body.classList.toggle('pv');shell();fit();scrollTo(0,0)}
else if(a=='v'){view=x;after()}else if(a=='tpl'){S.ui.tpl=x;after()}else if(a=='theme'){S.ui.theme=S.ui.theme=='dark'?'light':'dark';renderAll()}
else if(a=='tone'){d.cl.tone=x;rf()}else if(a=='gen'){gen();view='cl';rf()}
else if(a=='sum'){const p=d.p,ex=d.exp[0],sk=d.skills.split(',').map(s=>s.trim()).filter(Boolean).slice(0,3).join(', ');d.summary=`${p.title||'Professional'} with ${ex&&ex.o?'hands-on experience at '+ex.o:'a strong track record'} and expertise in ${sk||'the key skills of the role'}. Proven ability to deliver measurable results, collaborate across teams and learn quickly.`;rf()}
else if(a=='vb'){if(lastTA){const v=lastTA.value;lastTA.value=v+(v&&!v.endsWith('\n')?'\n':'')+x+' ';lastTA.dispatchEvent(new Event('input',{bubbles:true}));lastTA.focus()}else toast('Tap an achievements field first.')}
else if(a=='jd')out();else if(a=='sample'){sample();renderAll()}
else if(a=='pnew'){const id='p'+Date.now();S.pr[id]=blank();S.pr[id].pn='New CV';S.cur=id;renderAll()}
else if(a=='pdup'){const id='p'+Date.now();S.pr[id]=JSON.parse(JSON.stringify(d));S.pr[id].pn=(d.pn||'CV')+' (copy)';S.cur=id;renderAll()}
else if(a=='pdel'){if(Object.keys(S.pr).length>1){delete S.pr[S.cur];S.cur=Object.keys(S.pr)[0];renderAll()}else toast('You need at least one profile.')}
else if(a=='exp')sv('careerkit-backup.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));else if(a=='imp')$('#imp').click();
else if(a=='improve')improve();else if(a=='tail')tail();else if(a=='addapp'){d.apps.push({co:'',role:'',st:'Applied',fu:'',nt:''});rf()}
else if(a=='phshow'){d.showPh=!d.showPh;rf()}else if(a=='phrm'){d.photo='';phImg=null;rf()}
else if(a=='pdf')pdf();else if(a=='docx')docxf()});
const mig=d=>{d.apps=d.apps||[];d.photo=d.photo||'';if(d.showPh===undefined)d.showPh=true};
const photoUI=()=>`<h3>Photo (optional)</h3><input type="file" id="phf" accept="image/*" aria-label="Upload photo"><label>Crop zoom<input type="range" id="phz" min="1" max="3" step=".1" value="1"></label><div class="row"><button class="b" data-a="phshow">${D().showPh?'Hide photo':'Show photo'}</button><button class="b" data-a="phrm">Remove</button></div><p class="tip">Many regions prefer CVs without photos: hide it with one tap.</p>`;
let phImg=null;
function crop(){const d=D();if(!phImg)return;const c=document.createElement('canvas');c.width=c.height=300;const z=+(($('#phz')||{}).value||1),w=phImg.width,h=phImg.height,s=Math.min(w,h)/z;c.getContext('2d').drawImage(phImg,(w-s)/2,(h-s)/2,s,s,0,0,300,300);d.photo=c.toDataURL('image/jpeg',.85);d.showPh=true;after()}
document.addEventListener('change',e=>{if(e.target.id=='phf'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{phImg=i;crop()};i.onerror=()=>toast('Could not read that image.');i.src=r.result};r.readAsDataURL(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id=='phz')crop()});
const WK=[[/^(was )?responsible for /i,'Led '],[/^worked on /i,'Delivered '],[/^helped (to )?/i,'Supported '],[/^was in charge of /i,'Managed '],[/^(did|made) /i,'Executed '],[/^handled /i,'Managed ']];
function improve(){let n=0,q=0;D().exp.forEach(x=>{x.b=bl(x).map(l=>{let o=l;WK.forEach(([r,v])=>{if(r.test(o))o=o.replace(r,v)});o=o.charAt(0).toUpperCase()+o.slice(1).replace(/\.$/,'');if(o!=l)n++;if(!/\d/.test(o))q++;return o}).join('\n')});toast(`${n} bullet(s) improved; ${q} still lack numbers. Add %, $ or counts.`);rf()}
function tail(){const j=D().jd?jdm():null;if(!j||!j.k.length)return toast('Paste a job description in Tools first.');toast(j.miss.length?'Consider adding, if true for you: '+j.miss.slice(0,6).join(', '):'Great: your CV already covers the key terms.')}
function tracker(){const d=D(),t=new Date().toISOString().slice(0,10),O=['Applied','Interview','Offer','Rejected'];return `<p class="tip">Track applications privately on this device. Set a follow-up date to get a reminder badge.</p>`+d.apps.map((x,i)=>{const due=x.fu&&x.fu<=t&&['Applied','Interview'].includes(x.st);return `<div class="card"><div class="row"><b>${esc(x.co||'Application')} ${due?'<span class="k miss">Follow up!</span>':''}</b><button class="b" aria-label="Remove" data-a="rm:apps:${i}">✕</button></div>${I('Company',`apps.${i}.co`,'Northwind')}${I('Role',`apps.${i}.role`,'Head of Marketing')}<label>Status<select data-k="apps.${i}.st">${O.map(s=>`<option ${x.st==s?'selected':''}>${s}</option>`).join('')}</select></label><label>Follow-up date<input type="date" data-k="apps.${i}.fu" value="${esc(x.fu)}"></label>${I('Notes',`apps.${i}.nt`,'Spoke with recruiter Sam')}</div>`}).join('')+`<button class="b p" data-a="addapp">+ Add application</button>`+(d.apps.length?`<p class="tip">${O.map(s=>s+': '+d.apps.filter(x=>x.st==s).length).join(' · ')}</p>`:'')}
addEventListener('resize',fit);renderAll();
</script></body></html>
